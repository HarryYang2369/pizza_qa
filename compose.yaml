services:
  python-app:
    build:
      context: .
    container_name: python-app
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"  # Django development server
    # env_file: ./.env  # Uncomment if .env file exists
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    networks:
      - appnet
    depends_on: []
      # Add database or cache dependencies here if needed
      # - postgres
      # - redis
    # If you add a database service, add volumes for persistence

networks:
  appnet:
    driver: bridge
